<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Lockin — focus, strictly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Lockin is a study-first focus PWA: shape recurring schedule blocks with alarms, keep a daily task list, run wake-locked Study Mode sessions with strict enforcement, and track an honest slip log. Installable, offline, no account.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090c">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lockin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main navigation">
    <button data-nav="#/home"  aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>Home</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/schedule" aria-label="Schedule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14h3M8 17.5h7"/></svg>
      <span>Schedule</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/focus" aria-label="Study Mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V9.5"/><path d="M12 5.5 10.5 4M13.5 4 12 5.5M9.8 4.6h4.4"/></svg>
      <span>Focus</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/stats" aria-label="Stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 16v-5M12 16V7M17 16v-9"/></svg>
      <span>Stats</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2L10 21h4l.6-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      <span>Settings</span>
      <i class="tabdot"></i>
    </button>
  </nav>

  <script type="module" src="assets/js/app.js"></script>
  <noscript><div style="padding:24px">Lockin needs JavaScript — it's a focus app, not an audience tracker.</div></noscript>
</body>
</html>
