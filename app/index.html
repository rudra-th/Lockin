<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Resolve the theme before the first paint. Without this, a light-mode
       phone paints the dark canvas for a frame and then flips. -->
  <script>
    (function () {
      try {
        var pref = 'dark';
        var raw = localStorage.getItem('lockin.store.v1') || localStorage.getItem('lockin.trial.store.v2');
        if (raw) { var s = JSON.parse(raw); pref = (s && s.settings && s.settings.theme) || 'dark'; }
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        var color = dark ? '#07080a' : '#f6f5f0';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
      } catch (e) { /* private mode — the default dark canvas is fine */ }
    })();
  </script>
  <title>Lockin — a study clock that locks in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Lockin is a study-first focus PWA: recurring schedule blocks and alarms, a daily task list, wake-locked Study Mode, a daily target built from real minutes, and an optional Android kiosk. Installable, offline, no account.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07080a">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lockin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/design.css">
</head>
<body>
  <main id="view"></main>
  <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <nav class="tabbar" aria-label="Main navigation">
    <button data-nav="#/home"  aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      <span>Home</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/schedule" aria-label="Plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M8 14h3M8 17.5h7"/></svg>
      <span>Plan</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/focus" aria-label="Focus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V9.5"/><path d="M12 5.5 10.5 4M13.5 4 12 5.5M9.8 4.6h4.4"/></svg>
      <span>Focus</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/control" aria-label="Phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 18.5h3"/><path d="M9.5 7.5h5"/></svg>
      <span>Phone</span>
      <i class="tabdot"></i>
    </button>
    <button data-nav="#/settings" aria-label="You">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" focusable="false" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/></svg>
      <span>You</span>
      <i class="tabdot"></i>
    </button>
  </nav>

  <script type="module" src="assets/js/app.js"></script>
  <noscript><div style="padding:24px">Lockin needs JavaScript. Turn it on to use the app.</div></noscript>
</body>
</html>
