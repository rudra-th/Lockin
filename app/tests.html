<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lockin — self-check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body { padding: 22px 16px 40px; }
    h1 { font: 400 30px 'Fraunces', serif; margin: 0 0 2px; }
    .sub { color: var(--tx-2); font-size: 13px; margin-bottom: 16px; }
    .res { padding: 9px 12px; border-radius: 10px; font-size: 13.5px; margin-bottom: 6px;
           border: 1px solid var(--line); background: var(--panel); }
    .res.ok    { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
    .res.bad   { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
    .res small { color: var(--tx-3); display: block; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
    #summary { font: 600 15px 'IBM Plex Mono', monospace; margin-bottom: 12px; }
    .btn-back { margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Self-check</h1>
    <div class="sub">Pure-logic asserts for tasks, sessions, clean-day streaks, Strict Mode's accident window and schedule alarms. Runs on an in-memory copy — your real data is never touched. The same suite runs in CI via <code>npm test</code>.</div>
    <div id="out"></div>
    <a class="btn btn-subtle btn-back" href="index.html#/settings">Back to Lockin</a>
  </main>

  <script type="module">
    import { el } from './assets/js/util.js';
    import { runSelfCheck } from './assets/js/tests.mjs';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;

    /* The suite itself sandboxes lockin.* storage keys and loads the store;
       this page only renders what the reporter hands it. dom: true adds the
       five DOM-factory asserts that need a real document. */
    await runSelfCheck({
      group: (name) => {
        if (name) out.append(el('div', { class: 'res', style: 'background:var(--panel-2);font-weight:600' }, name));
      },
      ok: (name) => { pass += 1; out.append(el('div', { class: 'res ok' }, '✓ ' + name)); },
      bad: (name, err) => {
        fail += 1;
        out.append(el('div', { class: 'res bad' }, '✗ ' + name, el('small', {}, String(err && err.message || err))));
      },
    }, { dom: true });

    const summary = el('div', { id: 'summary' },
      pass + fail === 0 ? 'no asserts ran' : `${pass}/${pass + fail} passed`,
      fail ? el('span', { style: 'color:var(--warn)' }, ` · ${fail} failed`) : el('span', { style: 'color:var(--good)' }, ' · all good'));
    out.prepend(summary);
    document.title = fail ? `Self-check ✗ ${fail}` : `Self-check ✓ ${pass}`;
    /* Nothing to restore: every write above landed in the memory sandbox. */
  </script>
</body>
</html>
