<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Lockin glyph: stopwatch ring housing a padlock, lime on charcoal -->
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9FF6E"/>
      <stop offset="1" stop-color="#93BE1F"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0D12"/>

  <!-- stopwatch crown in the ring's top gap -->
  <circle cx="32" cy="11.5" r="2.7" fill="#C6F24E"/>
  <rect x="30.95" y="13.6" width="2.1" height="3.2" fill="#C6F24E"/>

  <!-- ring: 310° sweep, ~50° gap centred at 12 o'clock -->
  <circle cx="32" cy="35" r="19.5" fill="none" stroke="#C6F24E" stroke-width="4.4"
          stroke-linecap="round" stroke-dasharray="103 19.6" transform="rotate(-65 32 35)"/>

  <!-- padlock shackle (behind the body) -->
  <path d="M23.5 30.5 v-1.5 a8.5 8.5 0 0 1 17 0 v1.5"
        fill="none" stroke="#C6F24E" stroke-width="3.6"/>

  <!-- padlock body -->
  <rect x="20" y="27" width="24" height="20" rx="5.5" fill="url(#lime)"/>

  <!-- keyhole -->
  <circle cx="32" cy="35.4" r="3.1" fill="#0B0D12"/>
  <rect x="30.65" y="35.4" width="2.7" height="6.4" rx="1.3" fill="#0B0D12"/>
</svg>
