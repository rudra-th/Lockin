apply plugin: 'com.android.application'

/* Release signing reads android/keystore.properties (gitignored — never commit
   it). Copy keystore.properties.example, create a keystore once (the keygen is
   in docs/android-release.md), and fill the four values in. A release build
   without them fails fast below with the missing key named, instead of
   shipping a debug-signed APK that Play will reject. */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.lockin.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lockin.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 250
        versionName "1.15.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Values are only set when the properties file provides them;
            // debug builds never touch this config.
            if (keystorePropsFile.exists()) {
                def sf = keystoreProps.getProperty('storeFile')
                if (sf) storeFile file(sf)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        /* Google sign-in is bound to a signing certificate. The release
           certificate is the one registered in google-services.json, so debug
           builds sign with it too when keystore.properties is present —
           otherwise a debug APK gets DEVELOPER_ERROR from Google. */
        debug {
            if (keystorePropsFile.exists()
                && ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { keystoreProps.getProperty(it) }) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

/* Fail fast, with the missing piece named, before any task runs.
   whenReady sees the whole task graph first, so a release build without
   signing fails in seconds — not after minutes of packaging work. */
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] && it.project.name == 'app' }
    if (!releasing) return
    if (!keystorePropsFile.exists()) {
        throw new GradleException(
            "Release signing is not set up: android/keystore.properties is missing.\n" +
            "Copy android/keystore.properties.example, create a keystore (docs/android-release.md), and fill in the four values.")
    }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!keystoreProps.getProperty(key)) {
            throw new GradleException(
                "android/keystore.properties is missing '${key}' — see docs/android-release.md.")
        }
    }
    def keystoreFile = file(keystoreProps.getProperty('storeFile'))
    if (!keystoreFile.exists()) {
        throw new GradleException(
            "Keystore file not found: ${keystoreFile.absolutePath} — check storeFile in android/keystore.properties.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
